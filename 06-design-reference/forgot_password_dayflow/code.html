<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DayFlow - Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

            "primary": "#004ac6",

            "on-primary-fixed-variant": "#003ea8",
            "error-container": "#ffdad6",
            "secondary": "#006c49",
            "surface-bright": "#faf8ff",
            "tertiary": "#525657",
            "error": "#ba1a1a",
            "primary-fixed-dim": "#b4c5ff",
            "on-surface-variant": "#434655",
            "inverse-on-surface": "#eef0ff",
            "surface-container-low": "#f2f3ff",
            "outline-variant": "#c3c6d7",
            "on-tertiary-fixed-variant": "#444749",
            "on-secondary-fixed": "#002113",
            "secondary-container": "#6cf8bb",
            "inverse-primary": "#b4c5ff",
            "surface-container-highest": "#dae2fd",
            "inverse-surface": "#283044",
            "on-background": "#131b2e",
            "surface-variant": "#dae2fd",
            "on-primary-fixed": "#00174b",
            "on-secondary-fixed-variant": "#005236",
            "surface-tint": "#0053db",
            "on-primary-container": "#eeefff",
            "secondary-fixed-dim": "#4edea3",
            "on-secondary": "#ffffff",
            "surface-dim": "#d2d9f4",
            "surface-container": "#eaedff",
            "on-tertiary-container": "#eff1f3",
            "tertiary-container": "#6b6e70",
            "outline": "#737686",
            "on-error": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "surface-container-high": "#e2e7ff",
            "tertiary-fixed-dim": "#c4c7c9",
            "on-surface": "#131b2e",
            "primary-container": "#2563eb",
            "on-tertiary": "#ffffff",
            "on-tertiary-fixed": "#191c1e"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-md": "1.25rem",
            "space-xl": "3.5rem",
            "space-xs": "0.375rem",
            "gutter": "1.5rem",
            "margin": "2rem",
            "space-lg": "2rem",
            "space-sm": "0.75rem"
          },
          "fontFamily": {
            "headline-sm": ["Plus Jakarta Sans"],
            "headline-xl": ["Plus Jakarta Sans"],

            "headline-md": ["Plus Jakarta Sans"],

            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],

<body class="h-full bg-background font-body-md text-on-background antialiased flex flex-col justify-center items-center p-4 md:p-8">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 shadow-sm border border-outline-variant/20 flex flex-col items-center">
<!-- Brand Logo -->
<div class="flex items-center gap-2 mb-6">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<span class="font-headline-md text-primary font-extrabold tracking-tight text-2xl">DayFlow</span>
</div>
<!-- Header Text -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-on-surface mb-2">Forgot password?</h1>
<p class="font-body-md text-on-surface-variant max-w-xs">
        No worries, we'll send you reset instructions to get you back to your flow.
      </p>
</div>
<!-- Form State (Initial) -->
<form class="w-full flex flex-col gap-4" id="forgot-form" onsubmit="event.preventDefault(); showSuccessState();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-on-surface font-medium" for="email">Email address</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-outline material-symbols-outlined text-lg">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<button class="mt-2 w-full py-3 px-4 bg-primary-container text-on-primary font-label-md rounded-lg font-semibold hover:opacity-95 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Confirmation State (Hidden by default) -->
<div class="w-full hidden flex flex-col items-center text-center animate-fade-in" id="success-state">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
</div>
<h2 class="font-headline-sm text-on-surface mb-2">Check your email</h2>
<p class="font-body-sm text-on-surface-variant mb-6">
        We have sent a password recovery link to <span class="font-medium text-on-surface" id="sent-email-display">name@example.com</span>.
      </p>
<button class="w-full py-2.5 px-4 bg-surface-container text-on-surface font-label-md rounded-lg font-medium hover:bg-surface-container-high transition-all" onclick="resetForm()">
        Didn't receive the email? Try again
      </button>
</div>
<!-- Back to Sign In Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 font-label-md text-primary hover:underline font-medium" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
<span>Back to Sign In</span>
</a>
</div>
</div>
<footer class="mt-8 text-center font-body-sm text-on-surface-variant">
    © 2025 DayFlow Productivity Inc. All rights reserved.
  </footer>
<script>
    function showSuccessState() {
      const emailInput = document.getElementById('email').value;
      if(emailInput) {
        document.getElementById('sent-email-display').textContent = emailInput;
      }
      document.getElementById('forgot-form').classList.add('hidden');
      document.getElementById('success-state').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('success-state').classList.add('hidden');
      document.getElementById('forgot-form').classList.remove('hidden');
      document.getElementById('email').value = '';
    }
  </script>
</body></html>
