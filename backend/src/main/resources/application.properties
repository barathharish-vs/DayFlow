# Server Port Configuration
server.port=8080

# Application Name
spring.application.name=dayflow-backend

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dayflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Credentials via Environment Variables (DB_USERNAME and DB_PASSWORD)
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway Versioned Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keep Hibernate auto-update disabled (Flyway manages schema versioning)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Note: In production, supply a 256-bit secret via the JWT_SECRET environment variable
dayflow.jwt.secret=${JWT_SECRET:DayFlowSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026!}
dayflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Multipart upload limits (5MB per photo, 6MB request)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
